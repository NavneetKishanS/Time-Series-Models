  <rect x="30" y="252" width="28" height="36" rx="4" fill="#00BBBB" opacity="0.85" filter="url(#shadow)"/>
  <rect x="66" y="252" width="28" height="36" rx="4" fill="#00BBBB" opacity="0.85" filter="url(#shadow)"/>
  <rect x="102" y="252" width="28" height="36" rx="4" fill="#00BBBB" opacity="0.85" filter="url(#shadow)"/>
  <rect x="138" y="252" width="28" height="36" rx="4" fill="#00BBBB" opacity="0.85" filter="url(#shadow)"/>
  <rect x="174" y="252" width="28" height="36" rx="4" fill="#00BBBB" opacity="0.85" filter="url(#shadow)"/>
  <rect x="210" y="252" width="28" height="36" rx="4" fill="#00BBBB" opacity="0.85" filter="url(#shadow)"/>
