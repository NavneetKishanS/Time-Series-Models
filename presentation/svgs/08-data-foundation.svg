<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F7F7"/>
      <stop offset="100%" style="stop-color:#FFFFFF"/>
    </linearGradient>
    <linearGradient id="statGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003087"/>
      <stop offset="100%" style="stop-color:#009999"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000025"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="18" font-weight="700" fill="#003087">Data Foundation</text>
  <line x1="280" y1="44" x2="520" y2="44" stroke="#009999" stroke-width="2"/>

  <!-- ===================== SCANNER GRID ===================== -->
  <!-- 8 columns × 5 rows = 40 scanner icons -->
  <!-- Each cell: 28×28, starting at x=30, y=70, gap=8 -->

  <text x="152" y="68" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="11" font-weight="700" fill="#003087">40 MRI Scanners</text>

  <!-- Draw 40 scanner rectangles (8×5 grid) -->
  <!-- Row 1 -->
  <rect x="30" y="76" width="28" height="36" rx="4" fill="#003087" opacity="0.85" filter="url(#shadow)"/>
  <rect x="66" y="76" width="28" height="36" rx="4" fill="#003087" opacity="0.85" filter="url(#shadow)"/>
  <rect x="102" y="76" width="28" height="36" rx="4" fill="#003087" opacity="0.85" filter="url(#shadow)"/>
  <rect x="138" y="76" width="28" height="36" rx="4" fill="#003087" opacity="0.85" filter="url(#shadow)"/>
  <rect x="174" y="76" width="28" height="36" rx="4" fill="#003087" opacity="0.85" filter="url(#shadow)"/>
  <rect x="210" y="76" width="28" height="36" rx="4" fill="#003087" opacity="0.85" filter="url(#shadow)"/>
  <rect x="246" y="76" width="28" height="36" rx="4" fill="#003087" opacity="0.85" filter="url(#shadow)"/>
  <rect x="282" y="76" width="28" height="36" rx="4" fill="#003087" opacity="0.85" filter="url(#shadow)"/>
  <!-- Row 2 -->
  <rect x="30" y="120" width="28" height="36" rx="4" fill="#005588" opacity="0.85" filter="url(#shadow)"/>
  <rect x="66" y="120" width="28" height="36" rx="4" fill="#005588" opacity="0.85" filter="url(#shadow)"/>
  <rect x="102" y="120" width="28" height="36" rx="4" fill="#005588" opacity="0.85" filter="url(#shadow)"/>
  <rect x="138" y="120" width="28" height="36" rx="4" fill="#005588" opacity="0.85" filter="url(#shadow)"/>
  <rect x="174" y="120" width="28" height="36" rx="4" fill="#005588" opacity="0.85" filter="url(#shadow)"/>
  <rect x="210" y="120" width="28" height="36" rx="4" fill="#005588" opacity="0.85" filter="url(#shadow)"/>
  <rect x="246" y="120" width="28" height="36" rx="4" fill="#005588" opacity="0.85" filter="url(#shadow)"/>
  <rect x="282" y="120" width="28" height="36" rx="4" fill="#005588" opacity="0.85" filter="url(#shadow)"/>
  <!-- Row 3 -->
  <rect x="30" y="164" width="28" height="36" rx="4" fill="#007777" opacity="0.85" filter="url(#shadow)"/>
  <rect x="66" y="164" width="28" height="36" rx="4" fill="#007777" opacity="0.85" filter="url(#shadow)"/>
  <rect x="102" y="164" width="28" height="36" rx="4" fill="#007777" opacity="0.85" filter="url(#shadow)"/>
  <rect x="138" y="164" width="28" height="36" rx="4" fill="#007777" opacity="0.85" filter="url(#shadow)"/>
  <rect x="174" y="164" width="28" height="36" rx="4" fill="#007777" opacity="0.85" filter="url(#shadow)"/>
  <rect x="210" y="164" width="28" height="36" rx="4" fill="#007777" opacity="0.85" filter="url(#shadow)"/>
  <rect x="246" y="164" width="28" height="36" rx="4" fill="#007777" opacity="0.85" filter="url(#shadow)"/>
  <rect x="282" y="164" width="28" height="36" rx="4" fill="#007777" opacity="0.85" filter="url(#shadow)"/>
  <!-- Row 4 -->
  <rect x="30" y="208" width="28" height="36" rx="4" fill="#009999" opacity="0.85" filter="url(#shadow)"/>
  <rect x="66" y="208" width="28" height="36" rx="4" fill="#009999" opacity="0.85" filter="url(#shadow)"/>
  <rect x="102" y="208" width="28" height="36" rx="4" fill="#009999" opacity="0.85" filter="url(#shadow)"/>
  <rect x="138" y="208" width="28" height="36" rx="4" fill="#009999" opacity="0.85" filter="url(#shadow)"/>
  <rect x="174" y="208" width="28" height="36" rx="4" fill="#009999" opacity="0.85" filter="url(#shadow)"/>
  <rect x="210" y="208" width="28" height="36" rx="4" fill="#009999" opacity="0.85" filter="url(#shadow)"/>
  <rect x="246" y="208" width="28" height="36" rx="4" fill="#009999" opacity="0.85" filter="url(#shadow)"/>
  <rect x="282" y="208" width="28" height="36" rx="4" fill="#009999" opacity="0.85" filter="url(#shadow)"/>
