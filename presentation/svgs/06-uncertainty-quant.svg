<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F7F7"/>
      <stop offset="100%" style="stop-color:#FFFFFF"/>
    </linearGradient>
    <linearGradient id="headFill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#003087;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#003087;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="spineFill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#009999;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#009999;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#003087">Uncertainty Quantification: μ ± σ Per Prediction</text>
  <line x1="180" y1="44" x2="620" y2="44" stroke="#009999" stroke-width="2"/>
  <text x="400" y="62" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6B7B7B">Duration uncertainty drives schedule slack allocation — high σ = more buffer assigned</text>

  <!-- Shared axis -->
  <!-- X axis -->
  <line x1="60" y1="340" x2="740" y2="340" stroke="#333333" stroke-width="1.5"/>
  <text x="400" y="370" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#333333">Scan Duration (minutes)</text>
  <!-- X ticks -->
  <line x1="100" y1="340" x2="100" y2="347" stroke="#333333" stroke-width="1"/>
  <text x="100" y="360" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#555">0</text>
  <line x1="200" y1="340" x2="200" y2="347" stroke="#333333" stroke-width="1"/>
  <text x="200" y="360" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#555">5</text>
  <line x1="300" y1="340" x2="300" y2="347" stroke="#333333" stroke-width="1"/>
  <text x="300" y="360" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#555">10</text>
  <line x1="400" y1="340" x2="400" y2="347" stroke="#333333" stroke-width="1"/>
  <text x="400" y="360" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#555">15</text>
  <line x1="500" y1="340" x2="500" y2="347" stroke="#333333" stroke-width="1"/>
  <text x="500" y="360" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#555">20</text>
  <line x1="600" y1="340" x2="600" y2="347" stroke="#333333" stroke-width="1"/>
  <text x="600" y="360" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#555">25</text>
  <line x1="700" y1="340" x2="700" y2="347" stroke="#333333" stroke-width="1"/>
  <text x="700" y="360" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#555">30</text>

  <!-- =============================================
       HEAD SCAN: Narrow Gaussian (μ=8, σ=1.2)
       Centered around x=260 (8 min)
       scale: 20px per minute, base y=340
  ============================================= -->
  <!-- μ for HEAD: x = 100 + 8*20 = 260 -->
  <!-- σ region: x = 260 ± 1.2*20 = 260 ± 24, so 236 to 284 -->
  <!-- Peak y at ~120 (high narrow peak) -->

  <!-- Shaded 1σ region HEAD -->
  <path d="M 236,340 Q 248,200 260,160 Q 272,200 284,340 Z" fill="#003087" fill-opacity="0.18"/>
  <!-- Gaussian curve HEAD -->
  <path d="M 148,340 C 170,340 200,338 220,330 C 236,322 248,250 260,160 C 272,250 284,322 300,330 C 320,338 350,340 372,340"
        fill="none" stroke="#003087" stroke-width="3" stroke-linejoin="round"/>

  <!-- HEAD mean line -->
  <line x1="260" y1="160" x2="260" y2="340" stroke="#003087" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- HEAD annotations -->
  <rect x="195" y="92" width="130" height="62" rx="8" fill="#003087" fill-opacity="0.9"/>
  <text x="260" y="112" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">HEAD Scan</text>
  <text x="260" y="130" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#AADDFF">μ = 8.0 min</text>
  <text x="260" y="147" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#AADDFF">σ = 1.2 min</text>
  <!-- Arrow to curve -->
  <line x1="260" y1="155" x2="260" y2="163" stroke="#003087" stroke-width="1.5"/>

  <!-- σ bracket HEAD -->
  <line x1="236" y1="345" x2="284" y2="345" stroke="#003087" stroke-width="1.5"/>
  <line x1="236" y1="341" x2="236" y2="349" stroke="#003087" stroke-width="1.5"/>
  <line x1="284" y1="341" x2="284" y2="349" stroke="#003087" stroke-width="1.5"/>
  <text x="260" y="362" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" fill="#003087">±1σ = ±1.2 min</text>

  <!-- =============================================
       SPINE SCAN: Wide Gaussian (μ=18, σ=5)
       μ at x = 100 + 18*20 = 460
       σ region: 460 ± 5*20 = 460 ± 100 → 360..560
       Peak y at ~240 (low wide)
  ============================================= -->
  <!-- Shaded 1σ region SPINE -->
  <path d="M 360,340 Q 410,280 460,240 Q 510,280 560,340 Z" fill="#009999" fill-opacity="0.18"/>
  <!-- Gaussian curve SPINE -->
  <path d="M 160,340 C 220,340 280,339 320,338 C 350,337 380,330 420,315 C 440,306 450,275 460,240 C 470,275 480,306 500,315 C 540,330 570,337 600,338 C 640,339 700,340 760,340"
        fill="none" stroke="#009999" stroke-width="3" stroke-linejoin="round"/>

  <!-- SPINE mean line -->
  <line x1="460" y1="240" x2="460" y2="340" stroke="#009999" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- SPINE annotations -->
  <rect x="395" y="92" width="130" height="62" rx="8" fill="#009999" fill-opacity="0.9"/>
  <text x="460" y="112" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">SPINE Scan</text>
  <text x="460" y="130" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#DFFFFF">μ = 18.0 min</text>
  <text x="460" y="147" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#DFFFFF">σ = 5.0 min</text>
  <line x1="460" y1="155" x2="460" y2="243" stroke="#009999" stroke-width="1.5"/>

  <!-- σ bracket SPINE -->
  <line x1="360" y1="345" x2="560" y2="345" stroke="#009999" stroke-width="1.5"/>
  <line x1="360" y1="341" x2="360" y2="349" stroke="#009999" stroke-width="1.5"/>
  <line x1="560" y1="341" x2="560" y2="349" stroke="#009999" stroke-width="1.5"/>
  <text x="460" y="362" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" fill="#009999">±1σ = ±5.0 min</text>

  <!-- Insight callout -->
  <rect x="580" y="100" width="190" height="100" rx="10" fill="#FFF8E6" stroke="#EC6602" stroke-width="1.5"/>
  <text x="675" y="120" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#BB4400">Schedule Implication</text>
  <line x1="595" y1="127" x2="755" y2="127" stroke="#EC6602" stroke-width="0.8"/>
  <text x="675" y="143" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#553300">HEAD: tight schedule slot</text>
  <text x="675" y="158" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#553300">→  low buffer needed</text>
  <text x="675" y="175" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#553300">SPINE: wide σ → system</text>
  <text x="675" y="190" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#553300">allocates extra slack</text>

  <!-- Y axis label -->
  <text x="30" y="220" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#555" transform="rotate(-90,30,220)">Probability Density</text>

  <!-- Footer -->
  <text x="400" y="418" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#6B7B7B" font-style="italic">Durations predicted in log-space (log1p), then exponentiated — handles right-skewed distribution inherent to MRI scan times (30 s – 45 min)</text>
</svg>
