<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F7F7"/>
      <stop offset="100%" style="stop-color:#FFFFFF"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00000025"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#003087">Development Roadmap</text>
  <line x1="260" y1="44" x2="540" y2="44" stroke="#009999" stroke-width="2"/>

  <!-- ===================== TIMELINE RAIL ===================== -->
  <!-- Rail from x=80 to x=720, at y=200 -->
  <line x1="80" y1="210" x2="720" y2="210" stroke="#CCDDEE" stroke-width="3"/>

  <!-- Quarter positions: Q3=80+80=160, Q4=320, Q1=480, Q2=640 -->
  <!-- (quarter markers centered under nodes) -->

  <!-- ===================== Q3 2026 (CURRENT) ===================== -->
  <circle cx="160" cy="210" r="22" fill="#003087" filter="url(#shadow)"/>
  <text x="160" y="207" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Q3</text>
  <text x="160" y="221" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#00DDDD">2026</text>
  <!-- "NOW" badge -->
  <rect x="126" y="236" width="68" height="16" rx="8" fill="#EC6602"/>
  <text x="160" y="248" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">▶ NOW</text>

  <!-- Q3 deliverables (below rail) -->
  <rect x="50" y="262" width="220" height="130" rx="10" fill="#003087" opacity="0.9" filter="url(#shadow)"/>
  <text x="160" y="282" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#00DDDD">Model Stabilisation</text>
  <line x1="65" y1="288" x2="255" y2="288" stroke="#0055AA" stroke-width="0.8"/>
  <text x="70" y="305" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#DDEEFF">✓ Exchange model trained</text>
  <text x="70" y="320" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#DDEEFF">✓ Examination model trained</text>
  <text x="70" y="335" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#DDEEFF">✓ Orchestrator trained</text>
  <text x="70" y="350" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#AACCEE">→ Orchestrator validation</text>
  <text x="70" y="365" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#AACCEE">→ Bucket-based generation</text>
  <text x="70" y="382" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#AACCEE">→ Databricks production</text>

  <!-- Connector line Q3→Q4 -->
  <line x1="184" y1="210" x2="296" y2="210" stroke="#009999" stroke-width="3"/>

  <!-- ===================== Q4 2026 ===================== -->
  <circle cx="320" cy="210" r="22" fill="#007777" filter="url(#shadow)"/>
  <text x="320" y="207" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Q4</text>
  <text x="320" y="221" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#DFFFFF">2026</text>

  <!-- Q4 deliverables (above rail) -->
  <rect x="210" y="56" width="220" height="130" rx="10" fill="#007777" opacity="0.9" filter="url(#shadow)"/>
  <text x="320" y="76" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#DFFFFF">Customer Intelligence</text>
  <line x1="225" y1="82" x2="415" y2="82" stroke="#009999" stroke-width="0.8"/>
  <text x="230" y="99" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#CCFFFF">→ Per-customer fine-tuning</text>
  <text x="230" y="114" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#CCFFFF">→ MRRT Insight Agent MVP</text>
  <text x="230" y="129" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#CCFFFF">→ ROI simulation module</text>
  <text x="230" y="144" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#CCFFFF">→ Coil upgrade modelling</text>
  <text x="230" y="159" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#CCFFFF">→ Multi-site data ingestion</text>
  <text x="230" y="174" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#CCFFFF">→ Predictive maint. module</text>
  <!-- Connector line down -->
  <line x1="320" y1="188" x2="320" y2="186" stroke="#007777" stroke-width="2"/>

  <!-- Connector line Q4→Q1 -->
  <line x1="344" y1="210" x2="456" y2="210" stroke="#009999" stroke-width="3"/>

  <!-- ===================== Q1 2027 ===================== -->
  <circle cx="480" cy="210" r="22" fill="#009999" filter="url(#shadow)"/>
  <text x="480" y="207" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Q1</text>
  <text x="480" y="221" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#DFFFFF">2027</text>

  <!-- Q1 deliverables (below rail) -->
  <rect x="370" y="262" width="220" height="115" rx="10" fill="#009999" opacity="0.85" filter="url(#shadow)"/>
  <text x="480" y="282" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Integration &amp; Validation</text>
  <line x1="385" y1="288" x2="575" y2="288" stroke="#00AAAA" stroke-width="0.8"/>
  <text x="390" y="305" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#DFFFFF">→ VR training integration</text>
  <text x="390" y="320" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#DFFFFF">→ ROI dashboard (Unity)</text>
  <text x="390" y="335" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#DFFFFF">→ Clinical validation study</text>
  <text x="390" y="350" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#DFFFFF">→ External pilot site</text>
  <text x="390" y="365" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#DFFFFF">→ Real-time schedule API</text>

  <!-- Connector line Q1→Q2 -->
  <line x1="504" y1="210" x2="616" y2="210" stroke="#AAAAAA" stroke-width="3" stroke-dasharray="8,4"/>

  <!-- ===================== Q2 2027 ===================== -->
  <circle cx="640" cy="210" r="22" fill="#AAAAAA" filter="url(#shadow)"/>
  <text x="640" y="207" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Q2</text>
  <text x="640" y="221" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">2027</text>

  <!-- Q2 deliverables (above rail) -->
  <rect x="530" y="56" width="220" height="115" rx="10" fill="#888888" opacity="0.85" filter="url(#shadow)"/>
  <text x="640" y="76" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Scale &amp; Deploy</text>
  <line x1="545" y1="82" x2="735" y2="82" stroke="#999999" stroke-width="0.8"/>
  <text x="550" y="99" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#EEEEEE">→ Multi-site deployment</text>
  <text x="550" y="114" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#EEEEEE">→ SaaS product packaging</text>
  <text x="550" y="129" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#EEEEEE">→ Sales tool integration</text>
  <text x="550" y="144" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#EEEEEE">→ Coil portfolio simulator</text>
  <text x="550" y="159" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#EEEEEE">→ Customer portal launch</text>

  <!-- Footer note -->
  <text x="400" y="418" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#6B7B7B" font-style="italic">Timeline subject to revision based on clinical validation results and partner site availability</text>
</svg>
