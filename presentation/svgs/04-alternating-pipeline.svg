<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F7F7"/>
      <stop offset="100%" style="stop-color:#FFFFFF"/>
    </linearGradient>
    <linearGradient id="exchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#003087"/>
      <stop offset="100%" style="stop-color:#0050BB"/>
    </linearGradient>
    <linearGradient id="examGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#007777"/>
      <stop offset="100%" style="stop-color:#009999"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00000030"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#009999"/>
    </marker>
    <marker id="arrDown" markerWidth="6" markerHeight="8" refX="3" refY="7" orient="auto">
      <polygon points="0 0, 6 0, 3 8" fill="#6B7B7B"/>
    </marker>
    <marker id="arrUp" markerWidth="6" markerHeight="8" refX="3" refY="1" orient="auto">
      <polygon points="0 8, 6 8, 3 0" fill="#EC6602"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="18" font-weight="700" fill="#003087">The Alternating Pipeline</text>
  <line x1="200" y1="44" x2="600" y2="44" stroke="#009999" stroke-width="2"/>
  <text x="400" y="62" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="11" fill="#6B7B7B">A synthetic day is generated by cycling Exchange and Examination models end-to-end</text>

  <!-- RAIL LINE -->
  <line x1="60" y1="200" x2="740" y2="200" stroke="#CCDDEE" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- ===== BOX 1: Exchange (Startup) ===== -->
  <rect x="40" y="162" width="110" height="76" rx="10" fill="url(#exchGrad)" filter="url(#shadow)"/>
  <text x="95" y="192" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Exchange</text>
  <text x="95" y="208" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="9" fill="#AACCFF">Startup</text>
  <text x="95" y="224" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="8" fill="#7799CC">START → body₁</text>

  <!-- Arrow 1→2 -->
  <line x1="152" y1="200" x2="195" y2="200" stroke="#009999" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Token badge 100 above arrow -->
  <rect x="154" y="178" width="38" height="18" rx="9" fill="#EC6602"/>
  <text x="173" y="191" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">T:100</text>

  <!-- ===== BOX 2: Examination 1 ===== -->
  <rect x="197" y="162" width="110" height="76" rx="10" fill="url(#examGrad)" filter="url(#shadow)"/>
  <text x="252" y="192" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Examination</text>
  <text x="252" y="208" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="9" fill="#CCFFFF">Scan Sequence</text>
  <text x="252" y="224" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="8" fill="#99DDDD">body₁ scans</text>

  <!-- Arrow 2→3 -->
  <line x1="309" y1="200" x2="352" y2="200" stroke="#009999" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Token badge 104 above arrow -->
  <rect x="311" y="178" width="38" height="18" rx="9" fill="#003087"/>
  <text x="330" y="191" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="9" font-weight="700" fill="#AADDFF">T:104</text>

  <!-- ===== BOX 3: Exchange (Between) ===== -->
  <rect x="354" y="162" width="110" height="76" rx="10" fill="url(#exchGrad)" filter="url(#shadow)"/>
  <text x="409" y="192" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Exchange</text>
  <text x="409" y="208" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="9" fill="#AACCFF">Between</text>
  <text x="409" y="224" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="8" fill="#7799CC">body₁ → body₂</text>

  <!-- Arrow 3→4 -->
  <line x1="466" y1="200" x2="509" y2="200" stroke="#009999" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Token badge 100 above -->
  <rect x="468" y="178" width="38" height="18" rx="9" fill="#EC6602"/>
  <text x="487" y="191" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">T:100</text>

  <!-- ===== BOX 4: Examination 2 ===== -->
  <rect x="511" y="162" width="110" height="76" rx="10" fill="url(#examGrad)" filter="url(#shadow)"/>
  <text x="566" y="192" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Examination</text>
  <text x="566" y="208" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="9" fill="#CCFFFF">Scan Sequence</text>
  <text x="566" y="224" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="8" fill="#99DDDD">body₂ scans</text>

  <!-- Arrow 4→5 -->
  <line x1="623" y1="200" x2="666" y2="200" stroke="#009999" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Token badge 104 above -->
  <rect x="625" y="178" width="38" height="18" rx="9" fill="#003087"/>
  <text x="644" y="191" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="9" font-weight="700" fill="#AADDFF">T:104</text>

  <!-- ===== BOX 5: Exchange (Shutdown) ===== -->
  <rect x="668" y="162" width="110" height="76" rx="10" fill="url(#exchGrad)" filter="url(#shadow)"/>
  <text x="723" y="192" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Exchange</text>
  <text x="723" y="208" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="9" fill="#AACCFF">Shutdown</text>
  <text x="723" y="224" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="8" fill="#7799CC">body<tspan dy="3" font-size="6">n</tspan><tspan dy="-3"> </tspan>→ END</text>

  <!-- ===== PHASE LABELS (below boxes) ===== -->
  <text x="95" y="268" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="9" font-weight="600" fill="#003087">Phase: Startup</text>
  <text x="252" y="268" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="9" font-weight="600" fill="#007777">In-scan</text>
  <text x="409" y="268" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="9" font-weight="600" fill="#003087">Phase: Between</text>
  <text x="566" y="268" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="9" font-weight="600" fill="#007777">In-scan</text>
  <text x="723" y="268" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="9" font-weight="600" fill="#003087">Phase: Shutdown</text>

  <!-- ===== CONDITIONING INPUTS (downward arrows) ===== -->
  <!-- Section label -->
  <text x="400" y="304" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="10" font-weight="700" fill="#6B7B7B">CONDITIONING INPUTS (per model call)</text>
  <line x1="160" y1="308" x2="640" y2="308" stroke="#CCCCCC" stroke-width="1"/>

  <!-- Conditioning pill -->
  <rect x="80" y="318" width="148" height="28" rx="14" fill="#E6EEF8" stroke="#003087" stroke-width="1"/>
  <text x="154" y="336" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="9" fill="#003087">Age · Weight · Height · Direction</text>

  <rect x="244" y="318" width="120" height="28" rx="14" fill="#E6EEF8" stroke="#003087" stroke-width="1"/>
  <text x="304" y="336" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="9" fill="#003087">Body Region(s)</text>

  <rect x="380" y="318" width="130" height="28" rx="14" fill="#E6EEF8" stroke="#007777" stroke-width="1"/>
  <text x="445" y="336" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="9" fill="#007777">Coil State · Serial ID</text>

  <rect x="526" y="318" width="148" height="28" rx="14" fill="#E6EEF8" stroke="#007777" stroke-width="1"/>
  <text x="600" y="336" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="9" fill="#007777">Sequence Type · PTAB</text>

  <!-- ===== DURATION OUTPUT ===== -->
  <text x="400" y="385" text-anchor="middle" font-family="FreeSans,sans-serif" font-size="10" font-weight="700" fill="#EC6602">OUTPUT: Per-token durations with uncertainty  →  μ ± σ  (log-space, duration_scale = 60s)</text>

  <!-- Legend -->
  <rect x="220" y="408" width="16" height="14" rx="3" fill="#003087"/>
  <text x="242" y="419" font-family="FreeSans,sans-serif" font-size="10" fill="#003087">Exchange Model</text>
  <rect x="365" y="408" width="16" height="14" rx="3" fill="#009999"/>
  <text x="387" y="419" font-family="FreeSans,sans-serif" font-size="10" fill="#007777">Examination Model</text>
  <rect x="520" y="408" width="16" height="14" rx="9" fill="#EC6602"/>
  <text x="542" y="419" font-family="FreeSans,sans-serif" font-size="10" fill="#EC6602">Handoff token (T:100)</text>
</svg>
